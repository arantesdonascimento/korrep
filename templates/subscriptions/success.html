<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Status - Korrep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            background: var(--titanium);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .success-container {
            max-width: 500px;
            width: 100%;
            background: var(--white);
            border: 1px solid var(--steel);
            padding: 40px;
            text-align: center;
            position: relative;
        }
        .success-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--volt);
        }
        .success-eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--carbon);
            background: var(--volt);
            display: inline-block;
            padding: 6px 12px 6px 16px;
            margin-bottom: 16px;
        }
        .success-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
            color: var(--carbon);
        }
        .success-message {
            font-size: 14px;
            line-height: 1.6;
            color: #4B515C;
            margin-bottom: 32px;
        }
        .success-message p {
            margin-bottom: 12px;
        }
        .home-link {
            display: inline-block;
            padding: 12px 32px;
            background: var(--carbon);
            color: var(--titanium);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            border: 1px solid var(--carbon);
            transition: all 0.3s ease;
        }
        .home-link:hover {
            background: var(--volt);
            color: var(--carbon);
            border-color: var(--volt);
        }
    </style>
</head>
<body>
    <div class="success-container">
        <span class="success-eyebrow">Status</span>
        <h1 class="success-title">SUBSCRIPTION</h1>
        <div class="success-message">
            {% if messages %}
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            {% else %}
                <p>Thank you for your interest in Korrep.</p>
            {% endif %}
            <p>Check your email for confirmation instructions.</p>
        </div>
        <a href="/" class="home-link">Return Home</a>
    </div>
</body>
</html>
